name: CI

on:
  pull_request: {}

jobs:
  build:
    name: Build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # `verify` runs the offline suite only. The *IT tests call a real decision model,
      # so they stay behind the integration-tests profile.
      - name: Build
        run: ./mvnw -B verify
