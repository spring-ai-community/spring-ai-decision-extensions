name: Release to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Deploying a snapshot version here would publish a snapshot, not a release.
      - name: Check that the version is a release
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::The version is ${VERSION}. Set the release version in the poms first."
            exit 1
          fi
          echo "Releasing ${VERSION}"

      - name: Build and Test
        run: ./mvnw -B -U clean verify

      - name: Publish to Maven Central
        run: ./mvnw --batch-mode -Prelease -Pjavadoc deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
